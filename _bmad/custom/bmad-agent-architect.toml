  "file:docs/adr/0001-servvia-is-the-operational-pos.md",
  "file:docs/adr/0002-reduced-first-pilot.md",
  "Requirements authority for Servvia (re-anchored 2026-10-05, Story 14.2), highest first: (1) explicit owner decisions; (2) PRD/product-requirements.md (SPRD: Part A requirements, Part B Enterprise Quality Bar, Part C architecture and repository structure); (3) the normative companion and refinement volumes, PRD/README.md and PRD/00-overview-and-conventions.md to PRD/09-administration.md (normative baseline accepted 2026-10-05; they refine SPRD and never override it); (4) accepted ADRs (docs/adr/0001, docs/adr/0002) and accepted controlled decisions (committed docs/decisions-log.md entries, the decision register in PRD/00 section 00.10, and the orchestrator Tier-2 decisions named in these facts); (5) verified repository reality, for current-state statements only; (6) accepted engineering evidence (accepted story specs, frozen objectives, evaluator results), for implementation status only; (7) BMAD planning output, as planning only; (8) historical planning and documents, as evidence only. PRD/00 section 00.1.1 orders ADRs above the volumes: a genuine conflict between an ADR and a volume is escalated to the orchestrator, never resolved by a BMAD workflow.",
  "When a step asks for 'the PRD document', use PRD/product-requirements.md together with PRD/README.md and PRD/00-overview-and-conventions.md, and consult the domain volume (PRD/01-home.md to PRD/09-administration.md) that owns the story's requirement IDs. When a step asks for 'the Architecture document', use PRD/product-requirements.md Part C (sections 28 to 36) together with ADR 0001 and ADR 0002; Part C is the only architecture and repository-structure authority. Derived and control documents are never authority: PRD/CONSOLIDATED_PRD.md (derived view), PRD/fileStructure.MD (derived), PRD/PRD_ALIGNMENT.md (control plane) and PRD/CHANGELOG-v5.1.md (record).",
  "fileRestructure.md is RETIRED (owner decision, 2026-10-05; consolidated into PRD/product-requirements.md Part C). It is not an input or an authority and must not be recreated. Accepted specs, frozen objectives, evaluator policy and historical documents that still name it describe the state at their time and are not rewritten.",
  "Never author or regenerate a competing canonical PRD (do not run bmad-prd to replace PRD/) or a competing architecture authority over PRD/product-requirements.md Part C (do not author an architecture spine). A genuine architecture change goes through Part C controlled change (section 28) before planning depends on it.",
  "Decided architecture, implementation incomplete (binding for planning; never treat as implemented): O-20 (named staff elevation distinct from device identity; contract in PRD/00 section 00.10.6), O-21 (canonical order provenance; PRD/00 section 00.10.6; no destructive enum or schema change), DEC-ADMIN-22 (event-triggered revocation of live connections), DEC-OPS-21 (device and system audit actors), P3 (effective-dated venue trading-day boundary; PRD/00 section 00.10.5), P11 (headline Net Sales incl. GST; PRD/00 section 00.10.5) and the approved Tier-2 register in PRD/00 section 00.10.4 (including DEC-OPS-1 cancel/void/comp, DEC-OPS-4 line-level routing effective at submission and DEC-FIN-11 uncertain-payment resolution). Implementation status comes only from verified repository evidence.",
  "Orchestrator Tier-2 controlled decisions (2026-10-05; not owner decisions; recorded in docs/checkpoints/2026-10-05/bmad-reconciliation-sprint-change-proposal.md sections 9, 12 and 17): D-1: the first pilot uses the transitional web KDS migrated to canonical Go Core; the permanent target is apps/android/kds; the web KDS is transitional and retires after native parity is proven and venues migrate; there is no permanent web KDS and no web-KDS-only feature becomes a requirement. D-3: the transitional pilot web KDS authenticates to Core with a per-device, venue-bound D8 device credential; ordinary KDS operation needs no human login; the Nest venue-PIN kds_device token is not the canonical authentication model. O-13 (architecture): KDS authentication uses a per-device, venue-bound D8 identity. O-10: the approved Android baseline in the next fact. PRD/product-requirements.md section 14 does not yet record O-10 and O-13 as decided; that is a pending controlled-change follow-up, not a reason to reopen them.",
  "O-10 Android baseline (approved Tier 2): native Kotlin (Kotlin 2.x stable, K2 generation); pinned Gradle wrapper; an Android Gradle Plugin from a supported, stable, mutually compatible version set; Kotlin DSL build scripts; Jetpack Compose with Material 3; JDK 17 baseline; one version catalog; Gradle dependency verification and locking; Hilt; Kotlin coroutines and Flow; OkHttp for HTTP and WebSocket; kotlinx.serialization; contract/OpenAPI-derived clients where appropriate; Room; DataStore; Android Keystore for protected device-credential material (hardware-backed or StrongBox where available and appropriate; StrongBox is opportunistic, never a universal device requirement; no reusable staff secret is stored on a device); JUnit, Turbine, MockWebServer, Robolectric, Compose UI, managed-device/instrumented and contract tests; Android Lint, ktlint/Spotless and detekt; required Android CI verification without continue-on-error; release signing isolated to a separately authorized release pipeline. Version governance is not 'always newest': Story 17.1 verifies official compatibility information and pins one supported, stable, mutually compatible, reproducible Kotlin/Gradle/AGP/Compose/JDK/SDK set, and planning never pins versions. minSdk is derived from approved venue hardware and is never below API 26 without a new architecture decision; targetSdk meets the selected distribution channel at release; the distribution channel is an owner/release choice.",
  "Architecture planning must preserve (PRD Part C, ADR 0001, ADR 0002): PostgreSQL is canonical; Go Core (services/core-platform) is the only canonical backend and owns transactional state; Prisma (apps/api/prisma) stays the only migration authority and published migrations are never rewritten; NestJS is transitional (O-2); external POS integration (IdealPOS, Venue Connector) is transitional legacy; the Windows POS (apps/windows/pos-terminal) is a client whose behaviour is frozen pending the owner POS analysis report; Venue Edge (services/venue-edge) owns local hardware and is never a source of business truth; the first-pilot card path is CARD3 only (trusted adapter through Venue Edge; only a payment_adapter D8 identity reports results; no staff-recorded card tender); there are exactly four Android applications: apps/android/waiter-tablet (Staff Mode and Guest Mode), apps/android/kds, apps/android/kiosk and apps/android/window-display. There is no permanent order-tablet or customer-tablet application, no fifth Android application and no permanent web KDS; the web Order Tablet and the web KDS are transitional.",
  "Open gates stay open and BLOCKED; planning never resolves them or invents values: O-1 (native Waiter Tablet for the pilot; ADR 0002 default is no); the owner/business parts of O-3 (card provider, acquirer, terminal, commercial terms), O-4 (pilot hardware purchase; whether the venue needs kitchen printing), O-5 (receipt and NZ tax-invoice content, with P5 advice) and O-6 (pilot day-close reports, with DEC-FIN-10); pilot venue and timing (P13); P6 financial-control values (before pilot enablement); P2 and other policy and configuration values (session, PIN, lockout, device-credential rotation); P5 (before production or any compliance commitment); P10 (before relevant production use); O-19 owner confirmation before release acceptance (its values are a planning baseline only); every other OWNER TARGET REQUIRED and OWNER DECISION REQUIRED item, the open decisions in PRD/product-requirements.md section 14 and PRD/00 section 00.10, R-3 and PENDING USER POS ANALYSIS REPORT. Never invent values, targets, provider behaviour, payment trust models or Windows POS behaviour. TARGET CAPABILITY — FUTURE DELIVERY items stay outside the executable backlog until DEC-X-17 schedules them.",
  "DL-117 (the 11 October 2026 milestone) is NOT approved. It is not authority, no plan or wave is dated by it, and nothing may depend on it.",
