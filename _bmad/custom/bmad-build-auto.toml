# Servvia team customization for bmad-build-auto: input isolation (approved 2026-10-03).
[workflow]
persistent_facts = [
  "file:PRD/README.md",
  "file:PRD/product-requirements.md",
  "file:fileRestructure.md",
  "file:docs/adr/0001-servvia-is-the-operational-pos.md",
  "file:docs/adr/0002-reduced-first-pilot.md",
  "file:docs/audits/production-readiness-2026-12.md",
  "Source precedence for Servvia (highest first): (1) actual repository and verified tests; (2) fileRestructure.md for architecture and repository ownership; (3) PRD/README.md + PRD/product-requirements.md (approved 2026-10-03) for requirements; (4) accepted ADRs and decision records (docs/adr/0001, docs/adr/0002, committed entries of docs/decisions-log.md); (5) the adopted production-readiness audit, as evidence and backlog input only; (6) BMAD output, as planning; (7) historical documents, as evidence only.",
  "The ONLY requirements source is PRD/README.md + PRD/product-requirements.md. When a step asks for 'the PRD document', use PRD/product-requirements.md. When a step asks for 'the Architecture document', use fileRestructure.md together with ADR 0001 and ADR 0002. The production-readiness audit is never a requirements source; PRD/ prevails on conflict.",
  "Never author or regenerate a competing canonical PRD (do not run bmad-prd to replace PRD/) or a competing architecture authority over fileRestructure.md (do not author an architecture spine).",
  "Unresolved items stay unresolved and BLOCKED: every OWNER TARGET REQUIRED and OWNER DECISION REQUIRED item, open decisions in PRD section 14 (including O-3 provider selection, O-5, O-6, O-13, O-19, O-20, O-21), R-3, and PENDING USER POS ANALYSIS REPORT. Never invent values, targets, provider behaviour, payment trust models or Windows POS behaviour.",
  "The DL-117 entry in docs/decisions-log.md (11 October 2026 milestone) and the matching ADR 0001 annotations are an UNCOMMITTED, UNAPPROVED draft pending owner approval. They are not authority and nothing may depend on them.",
  "Historical evidence only, never requirements or planning authority: docs/prd.md, docs/epics.md, docs/sprints.md, docs/mvp.md, docs/ux.md, docs/offline.md, docs/printers.md, docs/product-requirements.md (bannered [P2] snapshot), docs/target-operating-model.md, docs/planning/, docs/archive/, docs/integrations/, docs/discovery/, and any BMAD output that predates this installation.",
  "Servvia evaluation contract (Phase 2, approved 2026-10-04): implementation starts only against a FROZEN objective, identified in the invocation by a line `objective_anchor: commit=<sha> path=<objective path> sha256=<hex>` supplied by the orchestrator. Freezing, approving or changing an objective (its acceptance criteria, requirement interpretation, architecture constraints, expectation changes, scope, protected paths) is the orchestrator's authority, never this workflow's.",
  "Without an objective_anchor this workflow may only DRAFT an objective: write _bmad-output/implementation-artifacts/objective-drafts/<objectiveId>/v<version>.objective.json (schema in tooling/evaluator/README.md) from the ready-for-development story, run `node tooling/evaluator/bin/loop.mjs validate --objective-file <draft> --repo {project-root}`, report `OBJECTIVE READY FOR FREEZE` with the printed sha256, and HALT with status `blocked` and blocking condition `objective awaiting freeze`. Never implement against a draft. The draft is committed unchanged into _bmad-output/implementation-artifacts/objectives/ only when the orchestrator explicitly instructs it, naming the sha256 it approved; that commit is the anchor.",
  "In Servvia, bmad-build-auto status `done` means CANDIDATE PRODUCED, not complete. Technical completion is only the evaluator's decision CANDIDATE_READY_FOR_ACCEPTANCE (tooling/evaluator); acceptance, merging and pushing are the orchestrator's. The implementer's own account of its work never decides the outcome.",
  "A correction run (invocation names `failure_packet: <path>`) may only fix the implementation within the frozen objective's allowed surfaces so that it meets the objective. It must not change the objective, reinterpret an acceptance criterion, weaken, skip, focus, retire or delete a test, add a lint or type suppression, touch a forbidden surface, the evaluator or a check configuration, broaden scope or change architecture. If meeting the objective needs any of that, HALT with status `blocked` and blocking condition `NEEDS_REVIEW: <why>` instead of correcting. A correction is a new commit on top of the failed candidate: never amend, rebase or squash a candidate.",
]

activation_steps_append = [
  "Servvia objective gate. If the invocation has no `objective_anchor:` line, follow the persistent facts for drafting an objective and do not implement. Otherwise export the evaluator from the anchor commit into a new temporary directory (`git archive <commit> tooling/evaluator | tar -x -C <dir>`) and run `node <dir>/tooling/evaluator/bin/loop.mjs gate --repo {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex>`. Unless its output has \"gate\": \"OPEN\", HALT with status `blocked` and its `reason` as the blocking condition. Then load the frozen objective (`git show <commit>:<path>`) as binding context for planning, implementation and review: its acceptance criteria, allowed and forbidden surfaces, required tests and approved expectation changes. If the invocation names `failure_packet: <path>`, load the packet too; its `rules` are binding.",
]

on_complete = """
Servvia evaluation (only when this run reached status `done` with an objective_anchor): the work is a CANDIDATE, not complete. Using the evaluator exported from the anchor (as in the objective gate), run `node <dir>/tooling/evaluator/bin/loop.mjs advance --repo {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex> --candidate <full HEAD commit id>` plus the tool paths given in the invocation's `evaluator_tools:` line (for example `--node-modules`, `--go-root`, `--go-modcache`; never guess them). Report its JSON output verbatim as the run's outcome:
- CANDIDATE_READY_FOR_ACCEPTANCE: technically eligible; the orchestrator decides acceptance. Do not merge or push.
- CORRECT: report the `packetPath`. The next correction is a new bmad-build-auto run on the same branch with the same objective_anchor and `failure_packet: <packetPath>`, committing on top of this candidate.
- STOP: report the `reason`; no further correction is attempted. Return to the orchestrator.
Never describe the work as complete unless the decision is CANDIDATE_READY_FOR_ACCEPTANCE.
"""
