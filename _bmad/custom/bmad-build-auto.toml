# Servvia team customization for bmad-build-auto: input isolation (approved 2026-10-03; re-anchored to the normative PRD 2026-10-05, Story 14.2).
[workflow]
persistent_facts = [
  "file:PRD/product-requirements.md",
  "file:PRD/README.md",
  "file:PRD/00-overview-and-conventions.md",
  "file:docs/adr/0001-servvia-is-the-operational-pos.md",
  "file:docs/adr/0002-reduced-first-pilot.md",
  "Requirements authority for Servvia (re-anchored 2026-10-05, Story 14.2; governance closure the same day). External precedence, highest first: (1) explicit current owner decisions; (2) the normative PRD corpus under its own internal governance: PRD/product-requirements.md (SPRD: Part A requirements, Part B Enterprise Quality Bar, Part C architecture and repository structure), PRD/README.md and PRD/00-overview-and-conventions.md to PRD/09-administration.md (volumes refine SPRD and never override it); (3) accepted controlled architecture and decision records (accepted ADRs docs/adr/0001 and docs/adr/0002, committed docs/decisions-log.md entries, the decision register in PRD/00 section 00.10); (4) verified repository and test reality, for claims about implementation state only (it never overrides a normative requirement; it states what currently exists); (5) BMAD planning output, as planning only; (6) historical evidence. Inside the corpus, PRD/00 section 00.1.1 governs: in a direct architectural conflict an accepted ADR controls a conflicting volume statement unless a later controlled decision recorded in SPRD or PRD/00 section 00.10 explicitly supersedes it; if supersession is ambiguous, STOP and escalate to the orchestrator. Never reconcile conflicting normative sources silently.",
  "When a step asks for 'the PRD document', use PRD/product-requirements.md together with PRD/README.md and PRD/00-overview-and-conventions.md, and consult the domain volume (PRD/01-home.md to PRD/09-administration.md) that owns the story's requirement IDs. When a step asks for 'the Architecture document', use PRD/product-requirements.md Part C (sections 28 to 36) together with ADR 0001 and ADR 0002; Part C is the only architecture and repository-structure authority. Derived and control documents are never authority: PRD/CONSOLIDATED_PRD.md (derived view), PRD/fileStructure.MD (derived), PRD/PRD_ALIGNMENT.md (control plane) and PRD/CHANGELOG-v5.1.md (record).",
  "fileRestructure.md is RETIRED (owner decision, 2026-10-05; consolidated into PRD/product-requirements.md Part C). It is not an input or an authority and must not be recreated. Accepted specs, frozen objectives, evaluator policy and historical documents that still name it describe the state at their time and are not rewritten.",
  "Never author or regenerate a competing canonical PRD (do not run bmad-prd to replace PRD/) or a competing architecture authority over PRD/product-requirements.md Part C (do not author an architecture spine). A genuine architecture change goes through Part C controlled change (section 28) before planning depends on it.",
  "Decided architecture, implementation incomplete (binding for planning; never treat as implemented): O-10 (Android engineering baseline; PRD/product-requirements.md section 14, PRD/00 section 00.10.7), O-13 (per-device, venue-bound D8 KDS identity; same locations), O-20 (named staff elevation distinct from device identity; contract in PRD/00 section 00.10.6), O-21 (canonical order provenance; PRD/00 section 00.10.6; no destructive enum or schema change), DEC-ADMIN-22 (event-triggered revocation of live connections), DEC-OPS-21 (device and system audit actors), P3 (effective-dated venue trading-day boundary; PRD/00 section 00.10.5), P11 (headline Net Sales incl. GST; PRD/00 section 00.10.5) and the approved Tier-2 register in PRD/00 section 00.10.4 (including DEC-OPS-1 cancel/void/comp, DEC-OPS-4 line-level routing effective at submission and DEC-FIN-11 uncertain-payment resolution). Implementation status comes only from verified repository evidence.",
  "Orchestrator Tier-2 decisions (2026-10-05; not owner decisions). O-10 and O-13 are recorded as decided in PRD/product-requirements.md section 14 with contracts in PRD/00 section 00.10.7: O-13 means ordinary KDS operation uses a per-device, venue-bound D8 identity distinct from staff identity, with no human login; the Nest venue PIN is transitional and never canonical. D-1 and D-3 are accepted pilot-sequencing and transitional-authentication decisions recorded in docs/checkpoints/2026-10-05/bmad-reconciliation-sprint-change-proposal.md (sections 9 and 17), with their architectural consequences in PRD/00 section 00.10.7: D-1: the first pilot uses the transitional web KDS migrated to canonical Go Core; the permanent target is apps/android/kds; the web KDS is transitional and retires after native parity is proven and venues migrate; there is no permanent web KDS and no web-KDS-only feature becomes a requirement. D-3: the transitional pilot web KDS authenticates to Core with the O-13 per-device, venue-bound D8 credential; ordinary KDS operation needs no human login.",
  "O-10 Android baseline (decided Tier 2; PRD/00 section 00.10.7): native Kotlin (Kotlin 2.x stable, K2 generation); pinned Gradle wrapper; an Android Gradle Plugin from a supported, stable, mutually compatible version set; Kotlin DSL build scripts; Jetpack Compose with Material 3; JDK 17 baseline; one version catalog; Gradle dependency verification and locking; Hilt; Kotlin coroutines and Flow; OkHttp for HTTP and WebSocket; kotlinx.serialization; contract/OpenAPI-derived clients where appropriate; Room; DataStore; Android Keystore for protected device-credential material (hardware-backed or StrongBox where available and appropriate; StrongBox is opportunistic, never a universal device requirement; no reusable staff secret is stored on a device); JUnit, Turbine, MockWebServer, Robolectric, Compose UI, managed-device/instrumented and contract tests; Android Lint, ktlint/Spotless and detekt; required Android CI verification without continue-on-error; release signing isolated to a separately authorized release pipeline. Version governance is not 'always newest': Story 17.1 verifies official compatibility information and pins one supported, stable, mutually compatible, reproducible Kotlin/Gradle/AGP/Compose/JDK/SDK set, and planning never pins versions. minSdk is derived from approved venue hardware and is never below API 26 without a new architecture decision; targetSdk meets the selected distribution channel at release; the distribution channel is an owner/release choice.",
  "Architecture planning must preserve (PRD Part C, ADR 0001, ADR 0002): PostgreSQL is canonical; Go Core (services/core-platform) is the only canonical backend and owns transactional state; Prisma (apps/api/prisma) stays the only migration authority and published migrations are never rewritten; NestJS is transitional (O-2); external POS integration (IdealPOS, Venue Connector) is transitional legacy; the Windows POS (apps/windows/pos-terminal) is a client whose behaviour is frozen pending the owner POS analysis report; Venue Edge (services/venue-edge) owns local hardware and is never a source of business truth; the first-pilot card path is CARD3 only (trusted adapter through Venue Edge; only a payment_adapter D8 identity reports results; no staff-recorded card tender); there are exactly four Android applications: apps/android/waiter-tablet (Staff Mode and Guest Mode), apps/android/kds, apps/android/kiosk and apps/android/window-display. There is no permanent order-tablet or customer-tablet application, no fifth Android application and no permanent web KDS; the web Order Tablet and the web KDS are transitional.",
  "Open gates stay open and BLOCKED; planning never resolves them or invents values: O-1 (native Waiter Tablet for the pilot; ADR 0002 default is no); the owner/business parts of O-3 (card provider, acquirer, terminal, commercial terms), O-4 (pilot hardware purchase; whether the venue needs kitchen printing), O-5 (receipt and NZ tax-invoice content, with P5 advice) and O-6 (pilot day-close reports, with DEC-FIN-10); pilot venue and timing (P13); P6 financial-control values (before pilot enablement); P2 and other policy and configuration values (session, PIN, lockout, device-credential rotation); P5 (before production or any compliance commitment); P10 (before relevant production use); O-19 owner confirmation before release acceptance (its values are a planning baseline only); every other OWNER TARGET REQUIRED and OWNER DECISION REQUIRED item, the open decisions in PRD/product-requirements.md section 14 and PRD/00 section 00.10, R-3 and PENDING USER POS ANALYSIS REPORT. Never invent values, targets, provider behaviour, payment trust models or Windows POS behaviour. TARGET CAPABILITY — FUTURE DELIVERY items stay outside the executable backlog until DEC-X-17 schedules them.",
  "DL-117 (the 11 October 2026 milestone) is NOT approved. It is not authority, no plan or wave is dated by it, and nothing may depend on it.",
  "Historical evidence only, never requirements or planning authority: the retired fileRestructure.md, docs/prd.md, docs/epics.md, docs/sprints.md, docs/mvp.md, docs/ux.md, docs/offline.md, docs/printers.md, docs/product-requirements.md (bannered [P2] snapshot), docs/target-operating-model.md, docs/planning/ (planning output, never a requirements input), docs/archive/, docs/integrations/, docs/discovery/, docs/checkpoints/ (checkpoint and execution-state records; the 2026-10-05 sprint change proposal is the frozen planning target and the record of the D-1 and D-3 decisions, never requirements authority), any BMAD output that predates this installation, and the adopted production-readiness audit docs/audits/production-readiness-2026-12.md (evidence and backlog-sequencing input only; PRD/ prevails on conflict).",
  "Servvia evaluation contract (Phase 2, approved 2026-10-04): implementation starts only against a FROZEN objective, identified in the invocation by a line `objective_anchor: commit=<sha> path=<objective path> sha256=<hex>` supplied by the orchestrator. Freezing, approving or changing an objective (its acceptance criteria, requirement interpretation, architecture constraints, expectation changes, scope, protected paths) is the orchestrator's authority, never this workflow's.",
  "Without an objective_anchor this workflow plans and drafts, and never implements. Run steps 1 and 2 as written. When step 2's READY-FOR-DEVELOPMENT GATE has set the spec to `ready-for-dev`, do not continue to step 3. Instead: (1) run `node tooling/evaluator/bin/loop.mjs inputs --repo {project-root} --spec <spec path relative to the project root> --epic-context _bmad-output/implementation-artifacts/epic-<N>-context.md` and copy its `inputs` block verbatim; (2) write _bmad-output/implementation-artifacts/objective-drafts/<objectiveId>/v<version>.objective.json in schema `servvia.objective/v2` (tooling/evaluator/README.md): `storyId` is the story number (`12.5`, or `12.3a` for an orchestrator-scoped slice), `objectiveId` is `story-<epic>-<story>-<slug>` (`story-12-3a-core-database-timeouts`), `baseline` is the full HEAD commit id, there is no `approval` field, and acceptance criteria state observable behaviour and protected surfaces, not implementation shape (file names, algorithms) unless architecture requires it; (3) run `node tooling/evaluator/bin/loop.mjs validate --objective-file <draft> --repo {project-root}`; (4) report `OBJECTIVE READY FOR FREEZE` with the printed sha256 and draft path, and HALT with status `ready-for-dev` and blocking condition `waiting-for-objective-approval: draft <path> sha256 <hex>`. That halt is not a blocked or failed story: like BMAD's own halt after planning it leaves the spec at `ready-for-dev`, so the anchored run resumes it. Commit nothing. Freezing is the orchestrator's alone: it commits the draft unchanged under _bmad-output/implementation-artifacts/objectives/ together with the spec, on the draft's baseline, naming the sha256 it approved; that commit is the anchor (_bmad-output/implementation-artifacts/objectives/README.md).",
  "Epic context in Servvia is a canonical, committed input, compiled once per epic outside story runs and committed before story preparation. When _bmad-output/implementation-artifacts/epic-<N>-context.md is tracked by git and unmodified, it is the valid cached epic context whatever the file modification times: load it, and never recompile, regenerate, edit or overwrite it. If it is not committed, do not compile it in a story run: HALT with status `blocked` and blocking condition `canonical epic context for epic <N> is not committed`. Because a story run never writes the epic context, step 1's version-control check sees exactly the tree the run started from; never relax that check.",
  "In Servvia, bmad-build-auto status `done` means CANDIDATE PRODUCED, not complete. Technical completion is only the evaluator's decision CANDIDATE_READY_FOR_ACCEPTANCE (tooling/evaluator); acceptance, merging and pushing are the orchestrator's. The implementer's own account of its work never decides the outcome.",
  "A correction run (invocation names `failure_packet: <path>`) may only fix the implementation within the frozen objective's allowed surfaces so that it meets the objective. It must not change the objective, reinterpret an acceptance criterion, weaken, skip, focus, retire or delete a test, add a lint or type suppression, touch a forbidden surface, the evaluator or a check configuration, broaden scope or change architecture. If meeting the objective needs any of that, HALT with status `blocked` and blocking condition `NEEDS_REVIEW: <why>` instead of correcting. A correction is a new commit on top of the failed candidate: never amend, rebase or squash a candidate.",
  "A correction run starts from the exact failed candidate the controller's ledger records, never from the anchor, a sibling or any other commit; the objective gate checks this. That candidate's spec reads `status: done` only because the failed run finalized it: it is not a completed story, so a correction run never starts a follow-up review pass. Once the gate is OPEN with `\"run\": \"correction\"`, set the spec's frontmatter `status` to `in-progress` (never touching its `<intent-contract>`) and follow step-03-implement.md with that spec (`baseline_revision` becomes the failed candidate, so the diff and review cover the correction only). The implementation handoff is the configured one with exactly one line appended: `Correction input: first read the failure packet <packet path>; it is the evaluator's whole account of what failed, and its rules are binding.` The packet is the only evaluator output the implementer receives: never give it, or read on its behalf, the evaluator's logs, evidence records, ledger or policy.",
  "Subagent completion is an explicit gate, whatever the platform calls a launch (blocking, background, async or resumed). Keep a list of every subagent you launch or re-engage, by the id its launch returns. A launch or resume acknowledgement is not a result, and neither is a message a subagent sends while it is still running: a subagent has returned only when its completion notice (status completed) or its final hand-back for that launch has arrived. While any subagent on the list has not returned, do not read or write the diff, run verification, triage, edit, commit or run On Complete; re-engaging the implementer puts it back on the list. A subagent that ends failed or killed has not produced a result: HALT with status `blocked` and blocking condition `subagent did not complete: <id>`. On Complete runs only when no subagent is outstanding; the evaluator then refuses a checkout that is not exactly the committed candidate with a clean tree, before and after the evaluation.",
]

activation_steps_append = [
  "Servvia objective gate. If the invocation has no `objective_anchor:` line, follow the persistent facts for drafting an objective and do not implement. Otherwise require a clean checkout (`git status --porcelain` is empty); if not, HALT with status `blocked` and blocking condition `not a clean checkout`. Export the evaluator from the anchor commit into a new temporary directory (`git archive <commit> tooling/evaluator | tar -x -C <dir>`) and run `node <dir>/tooling/evaluator/bin/loop.mjs gate --repo {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex>`, adding `--failure-packet <path>` when the invocation names `failure_packet: <path>` and the flags of the invocation's `evaluator_dirs:` line when it has one. The gate, not this workflow, decides where the run may start: an initial run (no candidate evaluated yet) from exactly the anchor commit with no failure packet; a correction run from exactly the failed candidate the controller's ledger records, with the packet issued for it. Unless its output has \"gate\": \"OPEN\", HALT with status `blocked` and its `reason` as the blocking condition; never move HEAD to make it open. Then load the frozen objective (`git show <commit>:<path>`) as binding context for planning, implementation and review: its acceptance criteria, allowed and forbidden surfaces, required tests and approved expectation changes. If the invocation names `failure_packet: <path>`, load the packet too; its `rules` are binding.",
]

on_complete = """
Servvia evaluation (only when this run reached status `done` with an objective_anchor): the work is a CANDIDATE, not complete. Using the evaluator exported from the anchor (as in the objective gate), and only when no subagent is outstanding, run `node <dir>/tooling/evaluator/bin/loop.mjs advance --repo {project-root} --worktree {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex> --candidate <full HEAD commit id>` plus the flags of the invocation's `evaluator_dirs:` line when it has one and the tool paths given in the invocation's `evaluator_tools:` line (for example `--node-modules`, `--go-root`, `--go-modcache`, `--dotnet-root`, `--nuget-packages`; never guess them). Report its JSON output verbatim as the run's outcome:
- CANDIDATE_READY_FOR_ACCEPTANCE: technically eligible; the orchestrator decides acceptance. Do not merge or push.
- CORRECT: report the `packetPath`. The next correction is a new bmad-build-auto run on the same branch, checked out at exactly this candidate, with the same objective_anchor and `failure_packet: <packetPath>`, committing on top of this candidate.
- STOP: report the `reason`; no further correction is attempted. Return to the orchestrator.
Never describe the work as complete unless the decision is CANDIDATE_READY_FOR_ACCEPTANCE.
"""
