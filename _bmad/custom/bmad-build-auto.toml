# Servvia team customization for bmad-build-auto: input isolation (approved 2026-10-03).
[workflow]
persistent_facts = [
  "file:PRD/README.md",
  "file:PRD/product-requirements.md",
  "file:fileRestructure.md",
  "file:docs/adr/0001-servvia-is-the-operational-pos.md",
  "file:docs/adr/0002-reduced-first-pilot.md",
  "file:docs/audits/production-readiness-2026-12.md",
  "Source precedence for Servvia (highest first): (1) actual repository and verified tests; (2) fileRestructure.md for architecture and repository ownership; (3) PRD/README.md + PRD/product-requirements.md (approved 2026-10-03) for requirements; (4) accepted ADRs and decision records (docs/adr/0001, docs/adr/0002, committed entries of docs/decisions-log.md); (5) the adopted production-readiness audit, as evidence and backlog input only; (6) BMAD output, as planning; (7) historical documents, as evidence only.",
  "The ONLY requirements source is PRD/README.md + PRD/product-requirements.md. When a step asks for 'the PRD document', use PRD/product-requirements.md. When a step asks for 'the Architecture document', use fileRestructure.md together with ADR 0001 and ADR 0002. The production-readiness audit is never a requirements source; PRD/ prevails on conflict.",
  "Never author or regenerate a competing canonical PRD (do not run bmad-prd to replace PRD/) or a competing architecture authority over fileRestructure.md (do not author an architecture spine).",
  "Unresolved items stay unresolved and BLOCKED: every OWNER TARGET REQUIRED and OWNER DECISION REQUIRED item, open decisions in PRD section 14 (including O-3 provider selection, O-5, O-6, O-13, O-19, O-20, O-21), R-3, and PENDING USER POS ANALYSIS REPORT. Never invent values, targets, provider behaviour, payment trust models or Windows POS behaviour.",
  "The DL-117 entry in docs/decisions-log.md (11 October 2026 milestone) and the matching ADR 0001 annotations are an UNCOMMITTED, UNAPPROVED draft pending owner approval. They are not authority and nothing may depend on them.",
  "Historical evidence only, never requirements or planning authority: docs/prd.md, docs/epics.md, docs/sprints.md, docs/mvp.md, docs/ux.md, docs/offline.md, docs/printers.md, docs/product-requirements.md (bannered [P2] snapshot), docs/target-operating-model.md, docs/planning/, docs/archive/, docs/integrations/, docs/discovery/, and any BMAD output that predates this installation.",
  "Servvia evaluation contract (Phase 2, approved 2026-10-04): implementation starts only against a FROZEN objective, identified in the invocation by a line `objective_anchor: commit=<sha> path=<objective path> sha256=<hex>` supplied by the orchestrator. Freezing, approving or changing an objective (its acceptance criteria, requirement interpretation, architecture constraints, expectation changes, scope, protected paths) is the orchestrator's authority, never this workflow's.",
  "Without an objective_anchor this workflow plans and drafts, and never implements. Run steps 1 and 2 as written. When step 2's READY-FOR-DEVELOPMENT GATE has set the spec to `ready-for-dev`, do not continue to step 3. Instead: (1) run `node tooling/evaluator/bin/loop.mjs inputs --repo {project-root} --spec <spec path relative to the project root> --epic-context _bmad-output/implementation-artifacts/epic-<N>-context.md` and copy its `inputs` block verbatim; (2) write _bmad-output/implementation-artifacts/objective-drafts/<objectiveId>/v<version>.objective.json in schema `servvia.objective/v2` (tooling/evaluator/README.md): `storyId` is the story number (`12.5`, or `12.3a` for an orchestrator-scoped slice), `objectiveId` is `story-<epic>-<story>-<slug>` (`story-12-3a-core-database-timeouts`), `baseline` is the full HEAD commit id, there is no `approval` field, and acceptance criteria state observable behaviour and protected surfaces, not implementation shape (file names, algorithms) unless architecture requires it; (3) run `node tooling/evaluator/bin/loop.mjs validate --objective-file <draft> --repo {project-root}`; (4) report `OBJECTIVE READY FOR FREEZE` with the printed sha256 and draft path, and HALT with status `ready-for-dev` and blocking condition `waiting-for-objective-approval: draft <path> sha256 <hex>`. That halt is not a blocked or failed story: like BMAD's own halt after planning it leaves the spec at `ready-for-dev`, so the anchored run resumes it. Commit nothing. Freezing is the orchestrator's alone: it commits the draft unchanged under _bmad-output/implementation-artifacts/objectives/ together with the spec, on the draft's baseline, naming the sha256 it approved; that commit is the anchor (_bmad-output/implementation-artifacts/objectives/README.md).",
  "Epic context in Servvia is a canonical, committed input, compiled once per epic outside story runs and committed before story preparation. When _bmad-output/implementation-artifacts/epic-<N>-context.md is tracked by git and unmodified, it is the valid cached epic context whatever the file modification times: load it, and never recompile, regenerate, edit or overwrite it. If it is not committed, do not compile it in a story run: HALT with status `blocked` and blocking condition `canonical epic context for epic <N> is not committed`. Because a story run never writes the epic context, step 1's version-control check sees exactly the tree the run started from; never relax that check.",
  "In Servvia, bmad-build-auto status `done` means CANDIDATE PRODUCED, not complete. Technical completion is only the evaluator's decision CANDIDATE_READY_FOR_ACCEPTANCE (tooling/evaluator); acceptance, merging and pushing are the orchestrator's. The implementer's own account of its work never decides the outcome.",
  "A correction run (invocation names `failure_packet: <path>`) may only fix the implementation within the frozen objective's allowed surfaces so that it meets the objective. It must not change the objective, reinterpret an acceptance criterion, weaken, skip, focus, retire or delete a test, add a lint or type suppression, touch a forbidden surface, the evaluator or a check configuration, broaden scope or change architecture. If meeting the objective needs any of that, HALT with status `blocked` and blocking condition `NEEDS_REVIEW: <why>` instead of correcting. A correction is a new commit on top of the failed candidate: never amend, rebase or squash a candidate.",
  "A correction run starts from the exact failed candidate the controller's ledger records, never from the anchor, a sibling or any other commit; the objective gate checks this. That candidate's spec reads `status: done` only because the failed run finalized it: it is not a completed story, so a correction run never starts a follow-up review pass. Once the gate is OPEN with `\"run\": \"correction\"`, set the spec's frontmatter `status` to `in-progress` (never touching its `<intent-contract>`) and follow step-03-implement.md with that spec (`baseline_revision` becomes the failed candidate, so the diff and review cover the correction only). The implementation handoff is the configured one with exactly one line appended: `Correction input: first read the failure packet <packet path>; it is the evaluator's whole account of what failed, and its rules are binding.` The packet is the only evaluator output the implementer receives: never give it, or read on its behalf, the evaluator's logs, evidence records, ledger or policy.",
  "Subagent completion is an explicit gate, whatever the platform calls a launch (blocking, background, async or resumed). Keep a list of every subagent you launch or re-engage, by the id its launch returns. A launch or resume acknowledgement is not a result, and neither is a message a subagent sends while it is still running: a subagent has returned only when its completion notice (status completed) or its final hand-back for that launch has arrived. While any subagent on the list has not returned, do not read or write the diff, run verification, triage, edit, commit or run On Complete; re-engaging the implementer puts it back on the list. A subagent that ends failed or killed has not produced a result: HALT with status `blocked` and blocking condition `subagent did not complete: <id>`. On Complete runs only when no subagent is outstanding; the evaluator then refuses a checkout that is not exactly the committed candidate with a clean tree, before and after the evaluation.",
]

activation_steps_append = [
  "Servvia objective gate. If the invocation has no `objective_anchor:` line, follow the persistent facts for drafting an objective and do not implement. Otherwise require a clean checkout (`git status --porcelain` is empty); if not, HALT with status `blocked` and blocking condition `not a clean checkout`. Export the evaluator from the anchor commit into a new temporary directory (`git archive <commit> tooling/evaluator | tar -x -C <dir>`) and run `node <dir>/tooling/evaluator/bin/loop.mjs gate --repo {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex>`, adding `--failure-packet <path>` when the invocation names `failure_packet: <path>` and the flags of the invocation's `evaluator_dirs:` line when it has one. The gate, not this workflow, decides where the run may start: an initial run (no candidate evaluated yet) from exactly the anchor commit with no failure packet; a correction run from exactly the failed candidate the controller's ledger records, with the packet issued for it. Unless its output has \"gate\": \"OPEN\", HALT with status `blocked` and its `reason` as the blocking condition; never move HEAD to make it open. Then load the frozen objective (`git show <commit>:<path>`) as binding context for planning, implementation and review: its acceptance criteria, allowed and forbidden surfaces, required tests and approved expectation changes. If the invocation names `failure_packet: <path>`, load the packet too; its `rules` are binding.",
]

on_complete = """
Servvia evaluation (only when this run reached status `done` with an objective_anchor): the work is a CANDIDATE, not complete. Using the evaluator exported from the anchor (as in the objective gate), and only when no subagent is outstanding, run `node <dir>/tooling/evaluator/bin/loop.mjs advance --repo {project-root} --worktree {project-root} --anchor-commit <commit> --objective <path> --objective-sha256 <hex> --candidate <full HEAD commit id>` plus the flags of the invocation's `evaluator_dirs:` line when it has one and the tool paths given in the invocation's `evaluator_tools:` line (for example `--node-modules`, `--go-root`, `--go-modcache`, `--dotnet-root`, `--nuget-packages`; never guess them). Report its JSON output verbatim as the run's outcome:
- CANDIDATE_READY_FOR_ACCEPTANCE: technically eligible; the orchestrator decides acceptance. Do not merge or push.
- CORRECT: report the `packetPath`. The next correction is a new bmad-build-auto run on the same branch, checked out at exactly this candidate, with the same objective_anchor and `failure_packet: <packetPath>`, committing on top of this candidate.
- STOP: report the `reason`; no further correction is attempted. Return to the orchestrator.
Never describe the work as complete unless the decision is CANDIDATE_READY_FOR_ACCEPTANCE.
"""
