openapi: 3.1.0
info:
  title: Servvia identity and devices API
  version: "nest-baseline-2026-09-28"
  description: |
    The current NestJS contract for staff authentication, KDS device auth,
    Order Tablet device identity and elevation, and Venue Connector enrollment.
    It describes behaviour as it is today, including warts (see `x-known-issues`),
    so that a Go service can match it exactly. Token claims are in
    ../schemas/auth-token-claims.schema.json and venue scoping is in
    ../schemas/venue-scope.md.

    Cross-cutting behaviour (applies to every operation below):
    - Global prefix `/api`. Source: apps/api/src/main.ts:151
    - Global ValidationPipe `{ whitelist: true, transform: true }`: unknown body
      properties are silently stripped, not rejected. Validation failures return
      400 `{ statusCode: 400, message: string[], error: "Bad Request" }`. Pipes
      run after guards, so guard errors (401/403/429) take precedence over 400.
      Source: apps/api/src/main.ts:150
    - No global guards or exception filters (no APP_GUARD/APP_FILTER), so errors use
      Nest's default HttpException body `{ statusCode, message, error? }`.
    - Middleware order is SecurityHeadersMiddleware, then CsrfMiddleware, applied to
      all routes. Middleware runs BEFORE guards. Source: apps/api/src/app.module.ts:194-197
    - CsrfMiddleware: on any request lacking a `csrf_token` cookie it sets
      `csrf_token=<64 hex>; Path=/; SameSite=Strict; Secure (production only)`, and it is
      not httpOnly. For methods other than GET, HEAD and OPTIONS it requires the header
      `x-csrf-token` to equal that cookie. The check is skipped when (a) the path contains
      `/auth/` or ends with `/auth`, (b) the path is exactly `/api/tablet/enroll` or
      `/api/connector/enroll`, (c) the `Authorization` header starts with `Bearer `, or
      (d) the path contains `/media-assets/local-dev-upload/`. Failure is
      403 `Invalid or missing CSRF token`. Source: apps/api/src/common/middleware/csrf.middleware.ts:7-83
    - RateLimitGuard (Redis sliding window) keys on `rate-limit:${req.ip}:${METHOD}:${req.path}`,
      so the bucket is per client IP and per concrete path (path params included). `req.ip`
      honours `trust proxy = TRUST_PROXY_HOPS` (default 0). When the guard is applied
      without `@RateLimit` metadata it defaults to 10 requests per 900 s. Over the limit it
      returns 429 with a `Retry-After` header (seconds). If Redis faults twice it returns
      503 `Authentication is temporarily unavailable.` (fail closed).
      Source: apps/api/src/auth/guards/rate-limit.guard.ts:137-251, apps/api/src/main.ts:104
    - CORS: an allowlist of origins with credentials enabled. Requests without an Origin are allowed.
      Source: apps/api/src/main.ts:108-149
  x-source: apps/api/src/main.ts:150
  x-unverified:
    - note: |
        CsrfMiddleware compares `req.path` against absolute paths such as `/api/tablet/enroll`.
        Whether Nest 11's middleware mounting (`forRoutes({ path: '*path' })`) exposes the full
        `/api/...` path in `req.path`, rather than a mount-relative one, is not determinable from
        this repository's code. The unit spec passes absolute paths, and code comments state it
        was reproduced against a running API. Source: apps/api/src/common/middleware/csrf.middleware.ts:46
  x-known-issues:
    - "A mutating request to a staff-only endpoint sent WITHOUT an Authorization header fails with 403 `Invalid or missing CSRF token` (middleware) rather than 401, unless the browser also sends a matching x-csrf-token. Source: apps/api/src/common/middleware/csrf.middleware.ts:76"
    - "The CSRF bypass matches any path containing `/auth/` anywhere, not only /api/auth/*. Source: apps/api/src/common/middleware/csrf.middleware.ts:48"
    - "Audit ipAddress for login/logout is taken from the raw x-real-ip / x-forwarded-for headers (client-spoofable), independent of TRUST_PROXY_HOPS. The rate-limit key uses req.ip instead. Source: apps/api/src/auth/auth.controller.ts:27"

servers:
  - url: /api

tags:
  - name: staff-auth
  - name: kds
  - name: tablet-device
  - name: tablet-admin
  - name: connector

paths:
  /auth/login:
    post:
      tags: [staff-auth]
      operationId: staffLogin
      summary: Email and password login for staff (Admin Console)
      x-source: apps/api/src/auth/auth.controller.ts:16
      security: []
      x-guards: [RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/auth/auth.controller.ts:17" }
      x-csrf: "bypassed (path contains /auth/)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated. The refresh cookie is set and a `login` audit event is written.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshCookie"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: |
            `Invalid credentials`. Returned for an unknown email, a wrong password, or an
            inactive staff row, and the three cases are indistinguishable. A dummy argon2 verify
            normalises timing. A `login_failed` audit event is written only when the email exists.
            Source: apps/api/src/auth/auth.service.ts:47-71
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
              example: { statusCode: 401, message: "Invalid credentials", error: "Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }

  /auth/credential-setup:
    post:
      tags: [staff-auth]
      operationId: staffCredentialSetup
      summary: A staff member sets their own password with a single-use setup code
      description: |
        Story 8.1. An administrator never chooses or sees a password: creating an account or
        resetting its credential issues a single-use setup code `<id>.<secret>` (24 hours; only
        an Argon2id hash is stored; a newer code ends older unused ones), and the staff member
        redeems it here. The code is consumed in the same transaction that sets the password,
        revokes every session of the staff member and writes the audit row. There is no shared
        sign-in: the shared Admin Console PIN (`/auth/admin-pin`) was removed by Story 2.4.
      x-source: apps/api/src/auth/auth.controller.ts:71
      security: []
      x-guards: [RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/auth/auth.controller.ts:72" }
      x-csrf: "bypassed (path contains /auth/)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialSetupRequest" }
      responses:
        "204": { description: Password set; every session of the staff member is revoked. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: |
            `Invalid or expired setup code`, the same for an unknown, used, revoked or expired
            code, a deactivated staff member, and a lost race for the same code.
            Source: apps/api/src/staff/credential-setup.service.ts:18
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
              example: { statusCode: 401, message: "Invalid or expired setup code", error: "Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }

  /auth/refresh:
    post:
      tags: [staff-auth]
      operationId: refreshAccessToken
      summary: Exchange the refresh_token cookie for a new staff access token
      description: |
        Guard order: RateLimitGuard (class level) runs first, then JwtRefreshGuard (route level).
        The refresh token is read ONLY from the `refresh_token` cookie and verified with HS256 and
        JWT_REFRESH_SECRET. Its `sub` must be a UUID of an existing, active Staff row. The refresh
        token is NOT rotated and no Set-Cookie is emitted.
      x-source: apps/api/src/auth/auth.controller.ts:76
      security:
        - refreshCookie: []
      x-guards: [RateLimitGuard, JwtRefreshGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/auth/auth.controller.ts:78" }
      x-csrf: "bypassed (path contains /auth/)"
      responses:
        "200":
          description: A new staff access token (claims as in the staffAccessToken branch).
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                additionalProperties: false
                properties:
                  accessToken: { type: string, description: "HS256 JWT, JWT_ACCESS_SECRET, JWT_ACCESS_EXPIRY (default 15m)" }
        "401":
          description: |
            `Unauthorized` (Passport default) when the cookie is missing, the signature is invalid,
            or the token has expired. `Session expired or account deactivated` when sub is missing,
            not a UUID, or the staff row is missing or inactive.
            Source: apps/api/src/auth/strategies/jwt-refresh.strategy.ts:27-39
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }

  /auth/logout:
    post:
      tags: [staff-auth]
      operationId: staffLogout
      summary: Clear the refresh cookie and audit the logout
      description: |
        Needs no authentication. Always clears the `refresh_token` cookie (same Path, SameSite and
        HttpOnly attributes as when it was set). If a refresh cookie is present and valid, a `logout`
        audit event is written for that staff member; any error in that step is swallowed. There is
        no server-side revocation, so a previously issued access token or refresh token stays valid
        until it expires.
      x-source: apps/api/src/auth/auth.controller.ts:85
      security: []
      x-guards: [RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/auth/auth.controller.ts:86" }
      x-csrf: "bypassed (path contains /auth/)"
      responses:
        "204":
          description: Always, unless rate limited. Empty body.
          headers:
            Set-Cookie:
              description: "`refresh_token=; Path=/api/auth/refresh; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict` (+ `Secure` in production). Source: apps/api/src/auth/auth.service.ts:184"
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }
      x-known-issues:
        - "The refresh cookie is scoped to Path=/api/auth/refresh, so browsers never send it to /api/auth/logout. The logout audit branch is effectively unreachable from a browser: it always logs 'Anonymous logout'. Source: apps/api/src/auth/auth.service.ts:37, apps/api/src/auth/auth.service.ts:202"

  /kiosk/kds/auth:
    post:
      tags: [kds]
      operationId: kdsDeviceAuth
      summary: Exchange a venue PIN for a venue-pinned KDS device token
      description: |
        The PIN is looked up in the env var KDS_VENUE_PINS, a JSON object mapping `{ "<venueId>": "<pin>" }`,
        and compared in constant time. The venue must exist and be active. Issues a `kds_device`
        token (role `kitchen`). No cookie is set.
      x-source: apps/api/src/auth/kds-auth.controller.ts:17
      security: []
      x-guards: [RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/auth/kds-auth.controller.ts:18" }
      x-csrf: "bypassed (path ends with /auth)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KdsAuthRequest" }
      responses:
        "200":
          description: Device token issued.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresIn]
                additionalProperties: false
                properties:
                  accessToken: { type: string, description: "kds_device JWT" }
                  expiresIn: { type: string, description: "The raw KDS_TOKEN_EXPIRY config string (default '12h'), not seconds.", x-source: "apps/api/src/auth/kds-auth.service.ts:69" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: |
            `Invalid venue or PIN`. Returned when there is no PIN configured for the venue, when
            KDS_VENUE_PINS is invalid JSON, when the PIN is wrong, or when the venue is missing or inactive.
            Source: apps/api/src/auth/kds-auth.service.ts:50-66
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
              example: { statusCode: 401, message: "Invalid venue or PIN", error: "Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InsecureDefaultPin" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }

  /tablet/enroll:
    post:
      tags: [tablet-device]
      operationId: tabletEnroll
      summary: Redeem a single-use tablet bootstrap token for a device identity and device token
      description: |
        `bootstrapToken` has the form `<enrollmentId>.<code>`, split at the FIRST '.'. The enrollment
        must exist, be unused, and be unexpired (15 min TTL), and the code must match its argon2id hash.
        Consumption is a guarded CAS update in a transaction that also creates a TabletDevice
        (status `active`, label = enrollment label or `Tablet YYYY-MM-DD`).
      x-source: apps/api/src/tablet/tablet-auth.controller.ts:28
      security: []
      x-guards: [RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/tablet/tablet-auth.controller.ts:30" }
      x-csrf: "bypassed (exact path /api/tablet/enroll)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletEnrollRequest" }
      responses:
        "200":
          description: Enrolled. The device starts in restricted mode with a tablet_device token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TabletEnrollResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: |
            `Invalid enrollment code` when the token has no usable '.' separator.
            `Enrollment code is invalid, expired, or already used` for an unknown, used or expired
            enrollment, or a code mismatch.
            Source: apps/api/src/tablet/tablet-auth.service.ts:275, apps/api/src/tablet/tablet-auth.service.ts:293
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "409":
          description: |
            `Enrollment code is invalid, expired, or already used` when a concurrent redeemer won the
            CAS race, or `A concurrent enrollment for this code is already in progress — retry shortly`
            on a Prisma P2002 unique violation.
            Source: apps/api/src/tablet/tablet-auth.service.ts:303, apps/api/src/tablet/tablet-auth.service.ts:333
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }
      x-known-issues:
        - "A durable device secret is generated and its argon2id hash stored, but the plaintext is never returned or used. The Prisma schema comment claims it is returned once. There is no device-token renewal endpoint, so a device must re-enroll when its 30d token expires. Source: apps/api/src/tablet/tablet-auth.service.ts:306-315, apps/api/prisma/schema.prisma:1503"

  /tablet/unlock:
    post:
      tags: [tablet-device]
      operationId: tabletUnlock
      summary: Validate the venue unlock PIN for an enrolled tablet (no token issued)
      description: |
        Checks `pin` against KDS_VENUE_PINS[token.venueId], the same env var the KDS uses. Mints no
        token and changes no server state apart from audit events
        (TABLET_UNLOCK_SUCCESS / TABLET_UNLOCK_FAILED). The "unlocked" state is enforced only by the client UI.
      x-source: apps/api/src/tablet/tablet-auth.controller.ts:38
      security:
        - deviceBearer: []
      x-accepted-token-kinds: [tablet_device, tablet_staff, tablet_manager]
      x-guards: [JwtAuthGuard, TabletDeviceGuard, RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/tablet/tablet-auth.controller.ts:40" }
      x-csrf: "bypassed (Bearer Authorization header)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletUnlockRequest" }
      responses:
        "200":
          description: PIN correct.
          content:
            application/json:
              schema:
                type: object
                required: [unlocked]
                additionalProperties: false
                properties:
                  unlocked: { const: true }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: |
            `Unauthorized` (missing, invalid or expired JWT); `This device has been revoked or is unknown`
            (TabletDeviceGuard); `Invalid venue PIN` (no PIN configured or wrong PIN).
            Source: apps/api/src/tablet/tablet-auth.service.ts:386, apps/api/src/tablet/tablet-auth.service.ts:415-422
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "403": { $ref: "#/components/responses/NotTabletDevice" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InsecureDefaultPin" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }
      x-known-issues:
        - "RateLimitGuard runs after JwtAuthGuard and TabletDeviceGuard, so unauthenticated or revoked callers are rejected without consuming, or being limited by, the rate-limit bucket. Source: apps/api/src/tablet/tablet-auth.controller.ts:39"

  /tablet/elevate:
    post:
      tags: [tablet-device]
      operationId: tabletElevateStaff
      summary: Elevate the tablet session to a named staff identity by staff PIN
      description: |
        Linear argon2id verify of `staffPin` against every Staff row in the TOKEN's organization with
        isActive=true, deletedAt=null and pinHash set. The first match wins. Returns a tablet_staff token
        pinned to the device and venue.
      x-source: apps/api/src/tablet/tablet-auth.controller.ts:58
      security:
        - deviceBearer: []
      x-accepted-token-kinds: [tablet_device, tablet_staff, tablet_manager]
      x-guards: [JwtAuthGuard, TabletDeviceGuard, RateLimitGuard]
      x-rate-limit: { limit: 8, windowSeconds: 900, x-source: "apps/api/src/tablet/tablet-auth.controller.ts:60" }
      x-csrf: "bypassed (Bearer Authorization header)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletStaffElevateRequest" }
      responses:
        "200":
          description: Elevated.
          content:
            application/json:
              schema:
                type: object
                required: [token, staff]
                additionalProperties: false
                properties:
                  token: { type: string, description: "tablet_staff JWT (TABLET_STAFF_ELEVATION_EXPIRY, default 20m)" }
                  staff: { $ref: "#/components/schemas/StaffIdentity" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: "`Unauthorized`; `This device has been revoked or is unknown`; `Incorrect staff PIN`. Source: apps/api/src/tablet/tablet-auth.service.ts:492"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "403": { $ref: "#/components/responses/NotTabletDevice" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }
      x-known-issues:
        - "Candidates are NOT filtered by venue access (the doc comment claims otherwise), so staff from any venue in the organization can elevate. Source: apps/api/src/tablet/tablet-auth.service.ts:463-470"
        - "If two staff share a PIN, the first row returned by findMany (no orderBy) wins. The result is nondeterministic. Source: apps/api/src/tablet/tablet-auth.service.ts:473"

  /tablet/manager-step-up:
    post:
      tags: [tablet-device]
      operationId: tabletManagerStepUp
      summary: Step the tablet session up to manager authority by manager PIN
      description: |
        Same verify loop as /tablet/elevate but restricted to roles manager, admin and owner. If the
        caller's token kind is `tablet_staff`, its `sub` is recorded as `actingStaffId` on the
        resulting tablet_manager token.
      x-source: apps/api/src/tablet/tablet-auth.controller.ts:77
      security:
        - deviceBearer: []
      x-accepted-token-kinds: [tablet_device, tablet_staff, tablet_manager]
      x-guards: [JwtAuthGuard, TabletDeviceGuard, RateLimitGuard]
      x-rate-limit: { limit: 8, windowSeconds: 900, x-source: "apps/api/src/tablet/tablet-auth.controller.ts:79" }
      x-csrf: "bypassed (Bearer Authorization header)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TabletManagerStepUpRequest" }
      responses:
        "200":
          description: Stepped up.
          content:
            application/json:
              schema:
                type: object
                required: [token, manager]
                additionalProperties: false
                properties:
                  token: { type: string, description: "tablet_manager JWT (TABLET_MANAGER_STEPUP_EXPIRY, default 5m)" }
                  manager: { $ref: "#/components/schemas/StaffIdentity" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: "`Unauthorized`; `This device has been revoked or is unknown`; `Incorrect manager PIN`. Source: apps/api/src/tablet/tablet-auth.service.ts:545"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "403": { $ref: "#/components/responses/NotTabletDevice" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/RateLimiterUnavailable" }
      x-known-issues:
        - "If the caller is already tablet_manager, no actingStaffId is carried forward. Candidates are not venue-filtered. Source: apps/api/src/tablet/tablet-auth.controller.ts:88, apps/api/src/tablet/tablet-auth.service.ts:521-529"

  /tablet/lock:
    post:
      tags: [tablet-device]
      operationId: tabletLock
      summary: Record a lock or logout audit event for the tablet
      description: |
        Writes TABLET_LOCK, attributed to the elevated staff member (token kind tablet_staff or
        tablet_manager) when that Staff row exists, and otherwise to the device's synthetic system actor.
        Does not revoke or invalidate any token.
      x-source: apps/api/src/tablet/tablet-auth.controller.ts:101
      security:
        - deviceBearer: []
      x-accepted-token-kinds: [tablet_device, tablet_staff, tablet_manager]
      x-guards: [JwtAuthGuard, TabletDeviceGuard]
      x-rate-limit: none
      x-csrf: "bypassed (Bearer Authorization header)"
      responses:
        "204":
          description: Audit recorded (audit write failures are swallowed). Empty body.
        "401":
          description: "`Unauthorized`; `This device has been revoked or is unknown`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NestError" }
        "403": { $ref: "#/components/responses/NotTabletDevice" }
      x-known-issues:
        - "Lock is audit-only. An elevated tablet_staff or tablet_manager token remains valid until its exp even after lock. The client must discard it. Source: apps/api/src/tablet/tablet-auth.service.ts:572"
        - "No rate limit on this endpoint. Source: apps/api/src/tablet/tablet-auth.controller.ts:102"

  /venues/{venueId}/tablet-devices/enrollments:
    post:
      tags: [tablet-admin]
      operationId: createTabletEnrollment
      summary: Create a single-use tablet bootstrap token (15 minute TTL)
      x-source: apps/api/src/tablet/tablet-devices-admin.controller.ts:25
      security:
        - staffBearer: []
      x-roles: [admin, manager]
      x-roles-note: "RolesGuard lets `owner` bypass all role checks. Source: apps/api/src/auth/guards/roles.guard.ts:42"
      x-accepted-token-kinds: [staff]
      x-guards: [JwtAuthGuard, RolesGuard, StaffSessionOnlyGuard, RateLimitGuard]
      x-rate-limit: { limit: 10, windowSeconds: 900, x-source: "apps/api/src/tablet/tablet-devices-admin.controller.ts:27" }
      x-csrf: "bypassed when the Bearer header is present"
      parameters:
        - $ref: "#/components/parameters/VenueIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTabletEnrollmentRequest" }
      responses:
        "201":
          description: Created (Nest default status for POST). Writes a TABLET_ENROLLMENT_CODE_CREATED audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentCreatedResponse" }
        "400": { $ref: "#/components/responses/ValidationErrorOrBadUuid" }
        "401": { $ref: "#/components/responses/JwtUnauthorized" }
        "403": { $ref: "#/components/responses/StaffAdminForbidden" }
        "404":
          description: "`Venue not found in your organization`. Source: apps/api/src/tablet/tablet-auth.service.ts:190"
          content:
            application/json:
