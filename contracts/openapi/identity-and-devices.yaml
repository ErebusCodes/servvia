components:
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A staff access token, meaning `kind` is absent (see auth-token-claims.schema.json#/$defs/staffAccessToken).
        Verified by Passport `jwt` with HS256 and JWT_ACCESS_SECRET. Every access-token kind is signed with
        the same secret, so JwtAuthGuard alone accepts device kinds too. Restricting a route to staff needs
        StaffSessionOnlyGuard. Source: apps/api/src/auth/strategies/jwt.strategy.ts:10
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A device-kind access token (kds_device, tablet_device, tablet_staff, tablet_manager), with the same
        HS256 and JWT_ACCESS_SECRET verification as staffBearer. Tablet endpoints further require a tablet_* kind
        with a deviceId whose TabletDevice.status is 'active' (TabletDeviceGuard).
        Source: apps/api/src/tablet/guards/tablet-device.guard.ts:20
    connectorCredential:
      type: http
      scheme: bearer
      bearerFormat: "<installationId>.<secret>"
      description: |
        An opaque connector credential, not a JWT. It is split at the first '.', the secret is verified
        against ConnectorInstallation.secretHash (argon2id), and the installation must have status 'active'.
        lastSeenAt is CAS-updated on every request. Failure returns 401 `Missing or invalid connector credential`.
        Used by connector endpoints outside this document, such as /api/connector/heartbeat.
        Source: apps/api/src/auth/guards/connector-auth.guard.ts:18, apps/api/src/connector/connector.service.ts:298
    connectorBootstrapToken:
      type: http
      scheme: bearer
      bearerFormat: "<enrollmentId>.<code>"
      description: "A single-use connector enrollment bootstrap token, accepted only by POST /api/connector/enroll. Source: apps/api/src/connector/connector.controller.ts:39"
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        A staff refresh JWT (HS256, JWT_REFRESH_SECRET, claims `{ sub, iat, exp }`). Cookie attributes:
        HttpOnly; SameSite=Strict; Path=/api/auth/refresh; Secure only when NODE_ENV=production;
        Max-Age = ms(JWT_REFRESH_EXPIRY), default 7d. Source: apps/api/src/auth/auth.service.ts:32-39, apps/api/src/auth/auth.service.ts:175-182
    csrf:
      type: apiKey
      in: header
      name: x-csrf-token
      description: |
        A double-submit token that must equal the `csrf_token` cookie (non-HttpOnly, Path=/, SameSite=Strict,
        64 hex chars, issued by CsrfMiddleware on any response to a request lacking it). Required on
        POST/PUT/PATCH/DELETE unless the request carries `Authorization: Bearer ...` or the path is exempt.
        Every operation in this document is exempt in practice, by path or by Bearer header.
        Source: apps/api/src/common/middleware/csrf.middleware.ts:14-79

  parameters:
    VenueIdPath:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: "Validated by ParseUUIDPipe. A non-UUID value returns 400 `Validation failed (uuid is expected)`."
      x-source: apps/api/src/tablet/tablet-devices-admin.controller.ts:29

  headers:
    SetRefreshCookie:
      description: "`refresh_token=<jwt>; Max-Age=<seconds>; Path=/api/auth/refresh; Expires=<date>; HttpOnly; SameSite=Strict` (+ `Secure` when NODE_ENV=production). Source: apps/api/src/auth/auth.service.ts:175"
      schema: { type: string }

  responses:
    ValidationError:
      description: class-validator failure (the global ValidationPipe).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
          example: { statusCode: 400, message: ["email must be an email"], error: "Bad Request" }
    ValidationErrorOrBadUuid:
      description: "A path parameter is not a UUID (`Validation failed (uuid is expected)`), or the body failed validation."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
    JwtUnauthorized:
      description: |
        `Unauthorized` (a missing, invalid or expired Bearer JWT, the Passport default), `Malformed token payload`,
        or `Session expired or account deactivated` (RolesGuard when req.user has no role).
        Source: apps/api/src/auth/strategies/jwt.strategy.ts:23, apps/api/src/auth/guards/roles.guard.ts:38
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
          example: { statusCode: 401, message: "Unauthorized" }
    StaffAdminForbidden:
      description: |
        `Insufficient permissions` (RolesGuard) or `This action requires a genuine staff login session`
        (StaffSessionOnlyGuard, for any token whose kind is present and not 'staff').
        Source: apps/api/src/auth/guards/roles.guard.ts:50, apps/api/src/auth/guards/staff-session-only.guard.ts:22
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
    NotTabletDevice:
      description: "`A valid tablet device identity is required`. Returned when the token kind is not tablet_* or deviceId is missing (including staff and kds_device tokens). Source: apps/api/src/tablet/guards/tablet-device.guard.ts:24"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the oldest request in the window expires (minimum 1).
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
          example: { statusCode: 429, message: "Too many requests, please try again later.", error: "Too Many Requests" }
      x-source: apps/api/src/auth/guards/rate-limit.guard.ts:213-232
    RateLimiterUnavailable:
      description: Redis rate-limit backend failed after one transient retry (fail closed).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }
          example: { statusCode: 503, message: "Authentication is temporarily unavailable.", error: "Service Unavailable" }
      x-source: apps/api/src/auth/guards/rate-limit.guard.ts:243-250
    InsecureDefaultPin:
      description: |
        NODE_ENV=production and the configured PIN equals the checked-in default '108'. The message is
        `<SURFACE> is still configured with the checked-in default PIN — refusing to serve production auth requests until this is changed.`
        Source: apps/api/src/auth/utils/insecure-default-pin.util.ts:17-22
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NestError" }

  schemas:
    NestError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - type: string
            - type: array
