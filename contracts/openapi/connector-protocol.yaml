    RateLimited:
      description: |
        Redis sliding-window limiter, key `rate-limit:<ip>:<METHOD>:<path>` (per client IP and per concrete path).
        Body `{ "statusCode": 429, "message": "Too many requests, please try again later.", "error": "Too Many Requests" }`.
      x-source: apps/api/src/auth/guards/rate-limit.guard.ts
      headers:
