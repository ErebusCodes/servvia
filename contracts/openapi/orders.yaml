  x-cancellation:
    x-legacy: true
    description: |
      On a real transition to `cancelled`, BEFORE writing the status, the
      legacy external-POS (IdealPOS) handoff is stopped via
      `stopHandoffForCancelledOrder(order, organizationId, actor)`, which
      returns `posDispatchStopped` recorded in the UPDATE_ORDER_STATUS audit
      `after` object:
      * no posSyncRecord -> true;
      * record `not_synced` -> CAS update to `cancelled`; 1 row -> true;
      * record `queued_for_connector` with a connector command -> cancel the
        ConnectorCommand; success -> mark record `cancelled`, true;
        failure (already accepted) -> falls through;
      * otherwise (unstoppable) -> logs error, writes posSyncRecord
        `errorMessage` = `Order was cancelled in Verdura, but POS dispatch
        (status was "<status>") could not be stopped in time — verify
        directly with IdealPOS/kitchen.` and returns false;
      * unexpected exception -> false.
      The status update proceeds regardless. To be removed with IdealPOS
      retirement; a replacement service without an external POS always
      records `posDispatchStopped: true`.
