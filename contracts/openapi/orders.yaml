  x-idempotency:
    description: |
      **Scope**: unique `(venueId, idempotencyKey)` (constraint
      `Order_venueId_idempotencyKey_key`). Key is REQUIRED on all three
      create routes, 16..255 chars. Keys are not scoped by route or source.

      **Lookup** happens before any other validation (so a replay is not
      rejected by the table-occupied guard for its own order), but AFTER
      venue resolution and — importantly — line pricing still runs before
      the replay decision.

      **Match rule** (`ordersMatchForReplay`), all must hold:
      1. `existing.source === expectedSource` (`kiosk` for /kiosk/orders,
         `staff` for /admin/orders and /tablet/orders).
      2. Staff/tablet only: `dto.serviceMode === existing.serviceMode`.
      3. Table reference (`tableReferenceMatches`): if the request carries
         `tableId`, it must equal `existing.tableId`; if it carries
         `tableNumber` (kiosk only), it must equal `existing.tableNumber`;
         if it carries neither, the existing order must have both null.
      4. Cart fingerprint equal: order-independent multiset of
         `menuItemId:quantity:[sorted modifier keys]` where a modifier key is
         `optionId` or, when null (kiosk), `name:<trimmed lowercased
         optionName>`. **Prices are excluded** — a replay after a price
         change still matches.
      Notes, guests, seat, expectedUnitPriceCents and stripePaymentIntentId
      are NOT compared.

      **Match** -> audit `ORDER_IDEMPOTENT_REPLAY` (best-effort), return the
      stored order (`include: { items: true }` only) with **201**. No
      re-verification of payment, no re-broadcast, no new print/KDS/POS rows.

      **Mismatch** -> audit `ORDER_IDEMPOTENCY_CONFLICT`, **409**
      `{ statusCode: 409, message: 'idempotencyKey "<key>" was already used
      to create a different order', error: "Conflict" }`. Original order is
      not modified.

      **Concurrency** (`recoverFromPersistConflict`, Prisma P2002 only):
      * Violation on idempotencyKey constraint -> re-fetch winner, apply the
        same match/mismatch rule (201 original or 409).
      * Violation on `Order_paymentProviderTransactionId_key`: if the winning
        row has the same venueId AND idempotencyKey it is treated as a replay
        (match rule applies); otherwise audit
        `ORDER_PAYMENT_REFERENCE_REUSE_REJECTED` and 409 `This payment
        reference is already linked to another order`.
      * Primary-key collision -> re-run persist up to 3 more times, then
        rethrow (500).
      * Any other error (incl. the in-transaction table-occupied 409) is
        rethrown unchanged.

      **Payment reference reuse** (kiosk only): unique
      `paymentProviderTransactionId` globally (NULLs allowed for staff
      orders). Pre-check before Stripe: if an order already holds this
      PaymentIntent id and it is NOT (same venue AND same idempotencyKey),
      audit `ORDER_PAYMENT_REFERENCE_REUSE_REJECTED` and 409 `This payment
      reference is already linked to another order`.
    x-source-constraint: apps/api/prisma/schema.prisma:896-898
    x-source-lookup: apps/api/src/orders/orders.service.ts:399-407
    x-source-fingerprint: apps/api/src/orders/orders.service.ts:430-454
    x-source-match: apps/api/src/orders/orders.service.ts:456-552
    x-source-outcome: apps/api/src/orders/orders.service.ts:562-619
    x-source-payment-ref: apps/api/src/orders/orders.service.ts:637-662
    x-source-recovery: apps/api/src/orders/orders.service.ts:673-836

  x-pricing:
    description: |
      All money is integer cents; the client never supplies a trusted price.
      Per line (`resolveOrderItems`, in request order):
      * MenuItem must exist with `organizationId = venue.organizationId AND
        deletedAt IS NULL`, else 400 `MenuItem with ID <id> not found`.
        (visibleChannels is NOT checked.)
      * Effective availability `override.isAvailable ?? item.isAvailable`;
        false -> 409 `Menu item "<title>" is currently unavailable`.
      * `basePriceCents = override.priceCents ?? item.priceCents`.
      * `unitPriceCents = basePriceCents + sum(resolved modifier priceDeltaCents)`.
      * `lineTotalCents = unitPriceCents * quantity`.
      * `seat` normalised: positive integer kept, anything else -> null.
      * Snapshot fields `menuItemTitle`, `menuItemCategory` (category name) persisted.
      Zero lines -> 400 `An order must contain at least one item`.

      Totals (`computeTotals`), new orders only: venue must have exactly
      `currency = "NZD"`, `taxJurisdiction = "NZ_GST"`,
      `pricesIncludeTax = true`, else 422 `Venue <id> has an unsupported tax
      configuration for total calculation (currency=<c>,
      taxJurisdiction=<t>, pricesIncludeTax=<b>) — refusing to guess a
      payable total.` Then:
      * `subtotalCents = sum(lineTotalCents)`
      * `taxCents = Math.round(subtotalCents * 3 / 23)` (GST contained,
        JS Math.round: halves round toward +infinity)
      * `totalCents = subtotalCents` (GST-inclusive, never additive)

      **STALE_PRICE** (`checkExpectedPrices`, new orders only, after the
      replay decision): for each line that supplied
      `expectedUnitPriceCents`, compare with the resolved `unitPriceCents`
      (matched by array index). Any mismatch -> **409** with body exactly
      (no statusCode/error keys):
      ```
      {
        "message": "One or more menu prices changed since this order was built — review the updated price(s) before resubmitting",
        "code": "STALE_PRICE",
        "conflicts": [
          { "menuItemId": "...", "menuItemTitle": "...",
            "expectedUnitPriceCents": 1500, "authoritativeUnitPriceCents": 1650 }
        ]
      }
      ```
      Applies to all three create routes (the DTO field is shared).
    x-source-lines: apps/api/src/orders/orders.service.ts:1146-1208
    x-source-totals: apps/api/src/orders/orders.service.ts:1456-1469
    x-source-compute: apps/api/src/orders/orders.service.ts:1580-1593
    x-source-stale: apps/api/src/orders/orders.service.ts:1408-1438

  x-modifier-resolution:
    description: |
      Parsed from `MenuItem.modifierGroups` via `parseModifierGroups` (see
      menu-read.yaml `ModifierGroupsJson` for the tolerant parse rules).
    nonStrict:
      usedBy: [POST /kiosk/orders]
      description: |
        Catalog = map of every option's `trim().toLowerCase()` name to its
        priceDeltaCents, across all groups (later duplicates overwrite
        earlier). For each selection: `name` trimmed must be non-empty, else
        400 `Each selected modifier must supply a name`. If found -> price
        from catalog. If not found and the item has any options -> 400
        `"<name>" is not a valid option for this item`. If the item has no
        options at all -> kept with priceDeltaCents 0. Client
        `priceDeltaCents`, `modifierGroupId`, `optionId` are ignored.
        Option isAvailable, group required/min/max are NOT enforced.
        Snapshot: `{ modifierGroupId: null, modifierGroupName: null,
        optionId: null, optionName: <trimmed name as sent>, priceDeltaCents }`.
      x-source: apps/api/src/orders/orders.service.ts:1285-1323
    strict:
      usedBy: [POST /admin/orders, POST /tablet/orders]
      description: |
        Checks in this order (first failure wins):
        1. Every selection has modifierGroupId AND optionId, else 400
           `Each selected modifier must specify modifierGroupId and optionId`.
        2. Item has no groups but selections sent -> 400 `This item has no
           configurable options`.
        3. Per selection: unknown group -> 400 `Unknown modifier group for
           this item`; unknown option in that group -> 400 `Unknown modifier
           option for this item`; option unavailable -> 409 `"<option>" is
           no longer available`; option id repeated -> 400 `Duplicate
           modifier option selected`.
        4. Per group (all groups of the item): required and 0 selections ->
           400 `"<group>" requires a selection`; (required or count>0) and
           count < minSelections -> 400 `"<group>" requires at least <n>
           selection(s)`; count > maxSelections -> 400 `"<group>" allows at
           most <n> selection(s)`.
        Snapshot per selection `{ modifierGroupId, modifierGroupName,
        optionId, optionName, priceDeltaCents }`, ordered grouped by group
        in first-selection order. `name`/`priceDeltaCents` from the client
        are ignored.
      x-source: apps/api/src/orders/orders.service.ts:1325-1390

